name: CI with Garnet Runtime Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      # Temporary safe test used to verify that Garnet detects new outbound runtime behaviour.
      - name: Controlled Garnet network demonstration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-time 15 \
            https://example.com \
            --output /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up npm 12
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
